name: Polyglot ecosystem coverage
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pnpm:
    name: Ecosystems / pnpm
    uses: Nisan-Sinai/github-workflows/.github/workflows/node-ci.yml@1f30dffd2898920d1e57d22547261557f8316171 # main
    with:
      package-manager: pnpm
      working-directory: ecosystems/node-pnpm
      install-command: pnpm install --no-frozen-lockfile
      lint-command: node --check test.js
      test-command: pnpm test

  yarn:
    name: Ecosystems / Yarn
    uses: Nisan-Sinai/github-workflows/.github/workflows/node-ci.yml@1f30dffd2898920d1e57d22547261557f8316171 # main
    with:
      package-manager: yarn
      working-directory: ecosystems/node-yarn
      install-command: yarn install
      lint-command: node --check test.js
      test-command: yarn test

  bun:
    name: Ecosystems / Bun
    uses: Nisan-Sinai/github-workflows/.github/workflows/node-ci.yml@1f30dffd2898920d1e57d22547261557f8316171 # main
    with:
      package-manager: bun
      working-directory: ecosystems/node-bun
      install-command: bun install --no-save
      lint-command: bun --version
      test-command: bun test.js

  python-pep621:
    name: Ecosystems / Python PEP 621
    uses: Nisan-Sinai/github-workflows/.github/workflows/python-ci.yml@1f30dffd2898920d1e57d22547261557f8316171 # main
    with:
      python-version: '3.12'
      working-directory: ecosystems/python-pep621
      install-command: python -m pip install .
      lint-command: python -m compileall -q src test.py
      typecheck-command: ''
      test-command: python test.py
      build-command: ''

  java:
    name: Ecosystems / Java Maven and Gradle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Maven tests
        run: mvn --batch-mode --no-transfer-progress -f ecosystems/java-maven/pom.xml test
      - name: Gradle tests
        working-directory: ecosystems/java-gradle
        run: gradle --no-daemon --console=plain test

  go:
    name: Ecosystems / Go modules
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'
          cache: false
      - name: Test
        working-directory: ecosystems/go
        run: |
          go mod download
          go test ./...

  rust:
    name: Ecosystems / Rust Cargo
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Format and test
        working-directory: ecosystems/rust
        run: |
          cargo fmt --check
          cargo test --all-targets

  php-ruby:
    name: Ecosystems / PHP Composer and Ruby Bundler
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: PHP Composer validation
        working-directory: ecosystems/php
        run: |
          composer validate --strict --no-check-lock
          composer install --no-interaction --no-progress --prefer-dist
          php test.php
      - name: Ruby Bundler validation
        working-directory: ecosystems/ruby
        run: |
          gem install --user-install bundler -v 2.5.23 --no-document
          export PATH="$(ruby -r rubygems -e 'puts Gem.user_dir')/bin:$PATH"
          bundle config set --local path vendor/bundle
          bundle install --jobs 4 --retry 3
          bundle exec rake test

  infrastructure:
    name: Ecosystems / Terraform Docker Helm Kubernetes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 'v1.16.5'
      - name: Terraform validation
        working-directory: ecosystems/terraform
        run: |
          terraform fmt -check
          terraform init -backend=false -input=false
          terraform validate
      - name: Docker and Compose validation
        run: |
          docker build -t managed-polyglot-test:local ecosystems/docker
          test "$(docker run --rm managed-polyglot-test:local)" = "central-manager-ok"
          docker compose -f ecosystems/docker/compose.yaml config --quiet
      - name: Helm validation
        run: helm lint ecosystems/helm/managed-test
      - name: Kubernetes client-side validation
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" \
            ghcr.io/yannh/kubeconform@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c \
            -strict -summary /work/ecosystems/kubernetes/deployment.yaml
